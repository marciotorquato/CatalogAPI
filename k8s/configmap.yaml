apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-configmap
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  RabbitMQ__Host: "rabbitmq-service"
  RabbitMQ__Username: "admin"
  Jwt__Issuer: "CatalogAPI"
  Jwt__Audience: "https://api.CatalogAPI.com"
  Serilog__WriteTo__0__Args__databaseUrl: "mongodb://root:root@mongodb-service:27017/logs_dev?authSource=admin"